<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frete COMEX PRO | Administração</title><style>body{font:16px system-ui;background:#f3f6fa;color:#0b203b;max-width:960px;margin:35px auto;padding:15px}h1{color:#0b203b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:white;border:1px solid #dce5ee;padding:20px;border-radius:12px}.num{font-size:30px;font-weight:750;color:#147eb4}table{border-collapse:collapse;width:100%;background:white}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}small{color:#637b91}</style><h1>Frete COMEX PRO — Painel</h1><p><small>Visão agregada. Não exibe dados pessoais dos participantes.</small></p><div class="cards" id="cards"></div><h2>Desempenho médio por pilar</h2><div id="pillars"></div><h2>Classificações</h2><div id="classes"></div><h2>Últimos diagnósticos</h2><table><thead><tr><th>Data</th><th>Nota</th><th>Classificação</th></tr></thead><tbody id="recent"></tbody></table><script>fetch('/api/admin/stats').then(r=>{if(!r.ok)throw Error('Acesso não autorizado ou serviço indisponível');return r.json()}).then(d=>{document.getElementById('cards').innerHTML=[['Diagnósticos',d.total],['Nota média',d.average],['Opt-in comercial',d.marketing_opt_in]].map(([a,b])=>`<div class="card"><div>${a}</div><div class="num">${b}</div></div>`).join('');document.getElementById('pillars').innerHTML=d.pillars.map(p=>`<div class="card" style="margin-bottom:8px">${p.name}: <b>${p.average}%</b><div style="background:#e4edf4;height:10px;border-radius:8px"><div style="width:${p.average}%;height:10px;background:#147eb4;border-radius:8px"></div></div></div>`).join('');document.getElementById('classes').textContent=Object.entries(d.classification).map(([k,v])=>`${k}: ${v}`).join(' • ');document.getElementById('recent').innerHTML=d.recent.map(r=>`<tr><td>${r.date}</td><td>${r.score}</td><td>${r.classification}</td></tr>`).join('')}).catch(e=>document.body.insertAdjacentHTML('beforeend','<p>Não foi possível carregar o painel. Verifique as credenciais e o banco de dados.</p>'));</script></html>
