name: Testes Raio-X V5.9
on:
  push:
    branches:
      - desenvolvimento-raio-x-v5-9
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências
        run: python -m pip install -r requirements.txt
      - name: Verificar sintaxe
        run: python -m py_compile server.py v59_scoring.py v59_api.py
      - name: Testar motor e API V5.9
        run: python -m unittest discover -s tests -p 'test_v59_*.py' -v
